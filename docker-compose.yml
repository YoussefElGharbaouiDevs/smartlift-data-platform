version: '3.8'

services:
  # ==========================================
  # 1. DATA WAREHOUSE - PostgreSQL 15
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: smartlift-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartlift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartlift_pass123}
      POSTGRES_DB: ${POSTGRES_DB:-smartlift_dw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    networks:
      - smartlift-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartlift} -d ${POSTGRES_DB:-smartlift_dw}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. DATA LAKE - MinIO (S3 Compatible Storage)
  # ==========================================
  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: smartlift-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartlift_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smartlift_pass123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - smartlift-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Auto-bucket Initialization Service
  minio-init:
    image: minio/mc:RELEASE.2023-09-02T06-42-30Z
    container_name: smartlift-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-smartlift_admin} ${MINIO_ROOT_PASSWORD:-smartlift_pass123};
      /usr/bin/mc mb myminio/smartlift-bronze --ignore-existing;
      /usr/bin/mc mb myminio/smartlift-silver --ignore-existing;
      /usr/bin/mc mb myminio/smartlift-gold --ignore-existing;
      echo 'MinIO Buckets initialized successfully!';
      exit 0;
      "
    networks:
      - smartlift-net

  # ==========================================
  # 3. STREAMING BUS - Zookeeper & Apache Kafka
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: smartlift-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    networks:
      - smartlift-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: smartlift-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - smartlift-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: smartlift-kafka-ui
    restart: always
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: SmartLift-Cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - smartlift-net

  # ==========================================
  # 4. ORCHESTRATION - Apache Airflow
  # ==========================================
  airflow-db:
    image: postgres:15-alpine
    container_name: smartlift-airflow-db
    restart: always
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_password
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - smartlift-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.7.1-python3.10
    container_name: smartlift-airflow-init
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__DATABASE_CONNECTOR: postgresql+psycopg2://airflow:airflow_password@airflow-db:5432/airflow
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_password@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
    command: version
    networks:
      - smartlift-net

  airflow-webserver:
    image: apache/airflow:2.7.1-python3.10
    container_name: smartlift-airflow-webserver
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "${AIRFLOW_PORT:-8085}:8080"
    environment:
      AIRFLOW__CORE__DATABASE_CONNECTOR: postgresql+psycopg2://airflow:airflow_password@airflow-db:5432/airflow
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_password@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./logs:/opt/airflow/logs
    command: webserver
    networks:
      - smartlift-net

  airflow-scheduler:
    image: apache/airflow:2.7.1-python3.10
    container_name: smartlift-airflow-scheduler
    restart: always
    depends_on:
      airflow-webserver:
        condition: service_started
    environment:
      AIRFLOW__CORE__DATABASE_CONNECTOR: postgresql+psycopg2://airflow:airflow_password@airflow-db:5432/airflow
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_password@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./logs:/opt/airflow/logs
    command: scheduler
    networks:
      - smartlift-net

# ==========================================
# NETWORKS & VOLUMES
# ==========================================
networks:
  smartlift-net:
    driver: bridge
    name: smartlift-network

volumes:
  postgres_data:
    name: smartlift_postgres_data
  minio_data:
    name: smartlift_minio_data
  airflow_postgres_data:
    name: smartlift_airflow_postgres_data
